# ============================================================
# 折跃门 wgp-node-hobby 配置文件（家庭宽带贡献版）
# 二进制启动时自动加载本文件（工作目录下的 wgp-node.conf）。
# 键名与 server/wgp-node/src/server.rs resolve_opts() 一一对应；
# 键名大小写不敏感，`-` 与 `_` 等价；# 或 ; 开头为注释。
# 优先级：命令行 --flag > WGP_* 环境变量 > 本文件 > 内置默认值
# ============================================================

# DHT 信令 UDP 绑定地址（SocketAddr 形态）
bind = 0.0.0.0:11010

# 观察者/STUN 端口（UDP；none = 关闭）
stun = 3478

# TCP 信令兜底端口（长度前缀帧；none = 关闭；UDP 被运营商限制时客户端由此接入）
tcp = 3481

# 贡献模式：拒绝 Forward 中转（PCDN 自保，07 §7）
# 注：wgp-node-hobby 二进制内部恒为 true 且不可关闭，此键仅为声明；
#     若用完整版 wgp-node 跑家庭宽带，也请保持 true。
hobby = true

# 观察者限频：每 IP 每窗口响应上限 / 窗口秒数
observer_rate_limit = 12
observer_rate_window = 10

# 节点身份文件（首启自动生成 32 字节种子，重启复用防止身份漂移 07 §8）
# 注意：勿删除；删除后 node_id 变化，等于换了一台新节点。
identity = node_identity.key

# 日志级别：error | warn | info | debug
log_level = info
