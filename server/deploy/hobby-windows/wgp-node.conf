# ============================================================
# 折跃门 wgp-node-hobby 配置文件（家庭宽带贡献版）
# 二进制启动时自动加载本文件（工作目录下的 wgp-node.conf）。
# 键名与 server/wgp-node/src/server.rs resolve_opts() 一一对应；
# 键名大小写不敏感，`-` 与 `_` 等价；# 或 ; 开头为注释。
# 优先级：命令行 --flag > WGP_* 环境变量 > 本文件 > 内置默认值
# ============================================================

# DHT 信令 UDP 绑定地址（SocketAddr 形态）
bind = 0.0.0.0:11010

# 观察者/STUN 端口（UDP；none = 关闭）
stun = 3478

# TCP 信令兜底端口（长度前缀帧；none = 关闭；UDP 被运营商限制时客户端由此接入）
tcp = 3481

# 贡献模式：拒绝 Forward 中转（PCDN 自保，07 §7）
# 注：wgp-node-hobby 二进制内部恒为 true 且不可关闭，此键仅为声明；
#     若用完整版 wgp-node 跑家庭宽带，也请保持 true。
hobby = true

# 对外宣告本节点的地址（可写公网 IPv4，也可写 DDNS 域名）。
# 路由器上的外部端口与本文件里的端口不一致时，用 advertise_dht_port / advertise_stun_port /
# advertise_tcp_port 写出外部端口（见 DEPLOY.md §10.1）。
# 宣告后，其他种子与客户端能自动发现本节点和它的观察者，并且知道本节点不中转、不会把房间放在这里。
# 家宽地址会变：写域名（配合 ddns_refresh）就不必改配置重启。
;advertise = <公网IPv4 或 DDNS 域名>
;ddns_refresh = 300
;advertise_dht_port = 0
;advertise_stun_port = 0
;advertise_tcp_port = 0

# 启动时去认识的其他种子（逗号分隔，udp://主机:端口，最多 16 个）。
# 贡献节点不中转信令，房间里的第二个人要靠一个完整版种子（wgp-node）才进得来；
# 把它填在这里，只认识本节点的客户端也能找到它，并改用它存放房间。
;peers = udp://<完整版种子>:11010

# 观察者限频：每 IP 每窗口响应上限 / 窗口秒数（默认 60/10s ≈ 15 个成员并发协商）
observer_rate_limit = 60
observer_rate_window = 10

# 节点身份文件（首启自动生成 32 字节种子，重启复用防止身份漂移 07 §8）
# 注意：勿删除；删除后 node_id 变化，等于换了一台新节点。
identity = node_identity.key

# 日志级别：error | warn | info | debug
log_level = info
