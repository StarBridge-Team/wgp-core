[workspace]
members = [
    "kernel/wgp-proto",
    "kernel/wgp-crypto",
    "kernel/wgp-punch",
    "kernel/wgp-dht",
    "kernel/wgp-core",
    "server/wgp-node",
    "client/wgp-client",
]
# vendor/ 放外部代码（EasyTier 协议兼容层），独立构建，不进本 workspace
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["折跃门团队"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "fs"] }
socket2 = "0.5"
x25519-dalek = { version = "2", features = ["getrandom", "zeroize", "static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
