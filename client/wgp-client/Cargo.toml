[package]
name = "wgp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "折跃门客户端命令行前端（基础开房/加入/链路状态；14 文档的参考外围）"

[[bin]]
name = "wgp-client"
path = "src/main.rs"

[dependencies]
