# Windows（MSVC）：静态链接 C 运行时。
# 默认是动态链接，产物会依赖 vcruntime140.dll——没装过 VC++ 运行库的机器上双击就报「找不到 DLL」。
# 我们的程序是发给别人解压即用的，所以本机构建、CI 与发版统一静态链接（Linux 发版包本来就是 musl 静态）。
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Linux 的 musl 目标：同样静态链接。多数 musl 目标默认就是静态的，但龙架构（loongarch64）默认动态链接，
# 不指定的话产物会依赖目标机器上的 musl 运行库。
# 交叉链接由 Zig 完成（cargo-zigbuild，见 .github/workflows/release.yml）：它自带 musl 与 compiler-rt，
# 不需要各架构的 gcc 工具链；本机交叉构建同一条命令：`cargo zigbuild --release --target <target>`。
[target.'cfg(target_env = "musl")']
rustflags = ["-C", "target-feature=+crt-static"]
